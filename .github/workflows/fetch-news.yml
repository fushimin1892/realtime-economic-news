name: Fetch News

# 5分おきに自動で実行する(READMEの「自動実行について」参照)。
# mainへのpushでも起動し、コードの変更をサイトへ反映する。手動でも実行できる。
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: write # 定期実行が自動で無効化されないようにする
  contents: read
  issues: write # health_check.pyのIssue自動作成・クローズ
  pages: write
  id-token: write

# デプロイを重ねない。待機中の実行は最新の1件だけ残る。
concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 変更のない状態が60日続くとGitHubが定期実行を止めるため、毎回有効にしておく
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/fetch-news.yml/enable" || echo "::warning::定期実行の有効化に失敗しました"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # news.json / status.json はコミットしないため、前回分は公開中のサイトから受け取る。
      # 取得失敗ソースの引き継ぎ、X投稿の蓄積、死活監視の間引きに使う。
      - name: Restore previous data from the live site
        run: |
          for f in news.json status.json; do
            if curl -fsS --retry 2 "https://fushimin1892.github.io/realtime-economic-news/$f?t=$(date +%s)" -o "$f.tmp" \
              && python -m json.tool "$f.tmp" > /dev/null; then
              mv "$f.tmp" "$f"
            else
              rm -f "$f.tmp"
              echo "::warning::$f を公開サイトから取得できませんでした"
            fi
          done

      - name: Fetch news
        run: python scripts/fetch_news.py

      - name: Check external services
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/health_check.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
          retention-days: 1

      - id: deployment
        uses: actions/deploy-pages@v5
