name: Fetch News

# GitHub内蔵のscheduleはこのリポジトリでほぼ発火しない実績があるため持たない。
# 外部cronからREST API経由でworkflow_dispatchを呼び出して起動する(READMEの「自動実行について」参照)。
on:
  workflow_dispatch:

# リポジトリ既定のGITHUB_TOKENは読み取り専用のため、必要な権限をここで明示する。
# contents: 生成物のコミット / issues: health_check.pyのIssue自動作成・クローズ
permissions:
  contents: write
  issues: write

# 実行が重なってもpushを競合させない。待機中の実行は最新の1件だけ残る。
concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch news
        run: python scripts/fetch_news.py

      - name: Check external services
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/health_check.py

      - name: Commit generated files
        run: |
          git config user.name "fushimin1892"
          git config user.email "208667471+fushimin1892@users.noreply.github.com"
          git add news.json status.json js/sources.js
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore: update news data"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "::warning::push失敗(${attempt}回目)。再試行します"
            sleep 5
          done
          exit 1
